<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Our Calendar</title>
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1d22" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="カレンダー">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=5">
  <script type="module" src="app.js?v=5"></script>
</head>
<body>
  <!-- ログイン画面 -->
  <section id="login-screen" class="login" hidden>
    <img src="icons/icon.svg" alt="" class="login-icon">
    <h1>Our Calendar</h1>
    <p id="login-message" class="login-message"></p>
    <button id="login-btn" class="btn primary large" type="button">Googleでログイン</button>
  </section>

  <!-- メイン画面 -->
  <div id="app" hidden>
    <header class="topbar">
      <div class="nav">
        <button id="prev-btn" class="icon-btn" type="button" aria-label="前の月">‹</button>
        <h1 id="title" class="title"></h1>
        <button id="next-btn" class="icon-btn" type="button" aria-label="次の月">›</button>
      </div>
      <div class="actions">
        <button id="today-btn" class="btn" type="button">今日</button>
        <button id="menu-btn" class="icon-btn" type="button" aria-label="メニュー">⋯</button>
      </div>
      <div class="subbar">
        <div id="filters" class="filters"></div>
        <div class="seg view-seg" role="tablist">
          <button type="button" data-view="month" role="tab">月</button>
          <button type="button" data-view="list" role="tab">一覧</button>
        </div>
      </div>
      <div id="loading" class="loading" hidden></div>
    </header>

    <div id="banner" class="banner" hidden></div>
    <main id="main"></main>
    <button id="add-btn" class="fab" type="button" aria-label="予定を追加">＋</button>
  </div>

  <!-- 1日の予定 -->
  <dialog id="day-dialog" class="sheet">
    <div class="sheet-head">
      <h2 id="day-title"></h2>
      <button class="icon-btn" type="button" data-close aria-label="閉じる">×</button>
    </div>
    <div id="day-events" class="day-events"></div>
    <button id="day-add-btn" class="btn primary block" type="button">この日に予定を追加</button>
  </dialog>

  <!-- 予定・タスクの追加と編集（全画面） -->
  <dialog id="event-dialog" class="page">
    <form id="event-form" novalidate>
      <header class="page-head">
        <button class="icon-btn" type="button" data-close aria-label="閉じる">×</button>
        <h2 id="event-dialog-title"></h2>
        <button id="save-btn" class="btn primary" type="submit">保存</button>
      </header>
      <div class="page-body">
        <div class="seg kind-seg" role="tablist">
          <button type="button" data-kind="event" role="tab">予定<small>その日にやること</small></button>
          <button type="button" data-kind="task" role="tab">タスク<small>その日までにやること</small></button>
        </div>

        <input name="title" class="title-input" type="text" placeholder="タイトル" autocomplete="off" enterkeyhint="done">

        <div id="persons" class="persons"></div>

        <section class="block">
          <div class="date-head">
            <span id="date-label" class="date-label"></span>
            <label id="multi-wrap" class="check"><input name="multi" type="checkbox"> 複数日</label>
          </div>
          <div id="mini-cal" class="mini-cal"></div>
        </section>

        <section id="event-times" class="block">
          <div class="time-row">
            <span>開始</span>
            <input name="startTime" type="time" step="300">
            <button class="clear" type="button" data-clear="startTime" aria-label="開始の時刻を消す">×</button>
          </div>
          <div class="time-row">
            <span>終了</span>
            <input name="endTime" type="time" step="300">
            <button class="clear" type="button" data-clear="endTime" aria-label="終了の時刻を消す">×</button>
          </div>
          <p class="hint">時刻が空欄なら終日の予定になります</p>
        </section>

        <section id="task-times" class="block">
          <div class="time-row">
            <span>期限の時刻</span>
            <input name="dueTime" type="time" step="300">
            <button class="clear" type="button" data-clear="dueTime" aria-label="期限の時刻を消す">×</button>
          </div>
          <label id="done-wrap" class="check done-check"><input name="done" type="checkbox"> 完了</label>
        </section>

        <label class="field">
          <span>メモ</span>
          <textarea name="description" rows="3"></textarea>
        </label>

        <p id="event-note" class="note" hidden></p>
        <p id="event-error" class="error" hidden></p>
        <button id="delete-btn" class="btn danger block" type="button">削除</button>
      </div>
    </form>
  </dialog>

  <!-- メニュー -->
  <dialog id="menu-dialog" class="sheet">
    <div class="sheet-head">
      <h2>メニュー</h2>
      <button class="icon-btn" type="button" data-close aria-label="閉じる">×</button>
    </div>
    <p id="menu-account" class="muted"></p>
    <h3 class="menu-heading">カレンダー</h3>
    <ul id="menu-calendars" class="legend"></ul>
    <div class="form-actions">
      <button id="reload-btn" class="btn" type="button">再読み込み</button>
      <span class="spacer"></span>
      <button id="logout-btn" class="btn danger" type="button">ログアウト</button>
    </div>
  </dialog>
</body>
</html>
